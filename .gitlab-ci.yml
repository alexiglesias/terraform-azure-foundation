# =============================================================================
# GitLab CI
#
# Every merge request and main: offline checks, no Azure access at all -
#   fmt + validate  ->  tflint  ->  checkov  ->  terraform test (mock providers)
#
# main only: deploy envs/dev to Azure -
#   plan (saved as an artifact)  ->  apply (manual button, applies that plan)
#
# The deploy jobs sign in with OIDC: GitLab gives each job a signed token, and
# Azure (bootstrap/ci.tf) only accepts tokens from this project's main branch.
# There is no Azure password or secret anywhere in GitLab.
#
# A merge request can only be merged when this pipeline is green
# (Settings > Merge requests > "Pipelines must succeed").
# =============================================================================

# Run one pipeline per change: for a merge request, or for main - never both
# for the same push.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - validate
  - security
  - test
  - plan
  - apply

variables:
  # Providers are downloaded once per pipeline cache, not once per folder.
  TF_PLUGIN_CACHE_DIR: "$CI_PROJECT_DIR/.terraform-plugin-cache"
  TF_IN_AUTOMATION: "true"

# Shared settings for jobs that run Terraform. Versions are pinned so the
# pipeline doesn't change underneath you - same as .terraform-version.
.terraform:
  image:
    name: hashicorp/terraform:1.16.4
    entrypoint: [""]
  before_script:
    - mkdir -p "$TF_PLUGIN_CACHE_DIR"
  cache:
    key: terraform-providers
    paths:
      - .terraform-plugin-cache/

fmt-validate:
  extends: .terraform
  stage: validate
  script:
    - terraform fmt -check -recursive -diff
    - |
      for d in bootstrap envs/dev; do
        echo "== $d"
        terraform -chdir=$d init -backend=false -input=false >/dev/null
        terraform -chdir=$d validate
      done

tflint:
  stage: validate
  image:
    name: ghcr.io/terraform-linters/tflint:v0.65.0
    entrypoint: [""]
  variables:
    TFLINT_PLUGIN_DIR: "$CI_PROJECT_DIR/.tflint.d/plugins"
  cache:
    key: tflint-plugins
    paths:
      - .tflint.d/plugins/
  script:
    - tflint --init
    - tflint --recursive

checkov:
  stage: security
  image:
    name: bridgecrew/checkov:3.4.3
    entrypoint: [""]
  script:
    - checkov --config-file .checkov.yaml

terraform-test:
  extends: .terraform
  stage: test
  script:
    # On main, the protected TF_VAR_* deploy settings (e.g. the Arm VM size)
    # are in every job's environment. Unit tests must only use their own
    # inputs, so drop them here.
    - for v in $(env | sed -n 's/^\(TF_VAR_[^=]*\)=.*/\1/p'); do unset "$v"; done
    - |
      for m in modules/*/; do
        echo "== $m"
        terraform -chdir=$m init -backend=false -input=false >/dev/null
        terraform -chdir=$m test
      done

# =============================================================================
# Deploy to Azure - main branch only
# =============================================================================

# Shared settings for the jobs that talk to Azure.
.azure:
  extends: .terraform
  # GitLab puts a signed OIDC token for this job in $ARM_OIDC_TOKEN. The
  # azurerm provider and backend swap it for an Azure access token.
  id_tokens:
    ARM_OIDC_TOKEN:
      aud: api://AzureADTokenExchange
  variables:
    ARM_USE_OIDC: "true"
    # ARM_CLIENT_ID, ARM_TENANT_ID and ARM_SUBSCRIPTION_ID are protected
    # CI/CD variables: they only exist in pipelines on protected branches.
    TF_VAR_subscription_id: $ARM_SUBSCRIPTION_ID
  before_script:
    - mkdir -p "$TF_PLUGIN_CACHE_DIR"
    - >
      terraform -chdir=envs/dev init -input=false
      -backend-config="resource_group_name=$TF_STATE_RESOURCE_GROUP"
      -backend-config="storage_account_name=$TF_STATE_STORAGE_ACCOUNT"
      -backend-config="container_name=tfstate"
      -backend-config="use_azuread_auth=true"
      -backend-config="use_oidc=true"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

plan:
  extends: .azure
  stage: plan
  resource_group: azure-dev # one job at a time touches the dev state
  script:
    - terraform -chdir=envs/dev plan -input=false -out=dev.tfplan
    - terraform -chdir=envs/dev show -no-color dev.tfplan > plan.txt
  artifacts:
    paths:
      - envs/dev/dev.tfplan
      - plan.txt
    expire_in: 1 week
    access: developer # plan files are for project members, not the public

apply:
  extends: .azure
  stage: apply
  needs: [plan] # applies exactly the plan saved by this pipeline
  resource_group: azure-dev
  environment:
    name: dev
  script:
    - terraform -chdir=envs/dev apply -input=false dev.tfplan
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual # a person reads plan.txt, then clicks apply
